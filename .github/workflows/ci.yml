name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: publish-form check (fmt + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 本仓库从「带 GUI/CLI 的原项目」发布，只校验发布形态（纯算法库）文件，
      # 不检查 bin 侧（src/main.rs / cli.rs / gui.rs / runner.rs）的历史格式差异
      - name: Check formatting (publish files only)
        run: rustfmt --check --edition 2021 --config skip_children=true src/lib.rs src/cas.rs src/perceptual.rs examples/compress_demo.rs

      - name: Build (no default features, pure algorithm)
        run: cargo build --no-default-features

      - name: Run tests (lib)
        run: cargo test --lib --no-default-features

      - name: Clippy (zero warnings, pure algorithm)
        run: cargo clippy --no-default-features --lib -- -D warnings
