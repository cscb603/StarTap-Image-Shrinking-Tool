# 交叉编译 Windows：静态链接 MSVC CRT，产出自包含 exe（用户无需装 VC++ 运行库）
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "target-cpu=x86-64-v2"]

# 让 build.rs 找到 llvm-rc（brew LLVM），用于注入 exe 图标/DPI 清单
# 仅交叉编译 Windows 时 build.rs 才读取此变量，macOS 原生构建不受影响
[env]
RC = "/opt/homebrew/opt/llvm/bin/llvm-rc"
